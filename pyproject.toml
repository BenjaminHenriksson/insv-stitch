[project]
name = "insv-stitch"
version = "0.1.0"
description = "From-scratch Linux pipeline for stitching Insta360 X5 dual-fisheye .insv footage into equirectangular 360° video."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Benjamin Henriksson" }]
dependencies = [
    "numpy>=2.0",
    "opencv-contrib-python>=4.10",
    "scipy>=1.14",
    "telemetry-parser>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["x5_pipeline.py"]
